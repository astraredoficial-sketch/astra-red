<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 140" width="550" height="140" role="img" aria-labelledby="astrared-title">
  <title id="astrared-title">AstraRed · Sinastría interpersonal y sincronía cósmica</title>
  <defs>
    <filter id="cosmic-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="monogram-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b0ff" />
      <stop offset="50%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <linearGradient id="orbit-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7597" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="text-astra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8d8e5" />
    </linearGradient>
    <linearGradient id="text-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#ff7597" />
    </linearGradient>
  </defs>
  <g transform="translate(15, 10)">
    <g transform="translate(60, 60)">
      <ellipse cx="0" cy="5" rx="46" ry="18" fill="none" stroke="#ff2a5f" stroke-opacity=".3" stroke-width="2" transform="rotate(-30)" />
      <path d="M 0,-42 L 26,30 L 14,30 L 0,-15 L -14,30 L -26,30 Z" fill="url(#monogram-grad)" filter="url(#cosmic-glow)" />
      <path d="M -8,8 L 8,8 L 0,0 Z" fill="#ffffff" fill-opacity=".9" filter="url(#cosmic-glow)" />
      <ellipse cx="0" cy="5" rx="46" ry="18" fill="none" stroke="url(#orbit-grad)" stroke-width="3.5" transform="rotate(-30)" filter="url(#cosmic-glow)" stroke-dasharray="190 40" />
      <circle cx="-32" cy="22" r="3" fill="#ffffff" filter="url(#cosmic-glow)" />
      <circle cx="32" cy="-12" r="2.5" fill="#ff7597" filter="url(#cosmic-glow)" />
      <circle cx="0" cy="-42" r="2" fill="#ffffff" filter="url(#cosmic-glow)" />
    </g>
    <g transform="translate(145, 68)">
      <text x="0" y="0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="44" font-weight="600" letter-spacing="4" fill="url(#text-astra)">ASTRA</text>
      <text x="175" y="0" font-family="Cinzel, Cormorant Garamond, Georgia, serif" font-size="44" font-weight="700" letter-spacing="4" fill="url(#text-red)" filter="url(#cosmic-glow)">RED</text>
      <text x="2" y="24" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="9.5" font-weight="500" letter-spacing="3.4" fill="#ffffff" fill-opacity=".5">SINASTRÍA INTERPERSONAL &amp; SINCRONÍA CÓSMICA</text>
    </g>
  </g>
</svg>
